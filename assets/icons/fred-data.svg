<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="fredBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2A3A"/>
      <stop offset="100%" stop-color="#0E1622"/>
    </linearGradient>
    <linearGradient id="fredBar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#E2B755"/>
    </linearGradient>
    <linearGradient id="fredBar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D94F3D"/>
      <stop offset="100%" stop-color="#F26B57"/>
    </linearGradient>
    <linearGradient id="fredBar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1B75BC"/>
      <stop offset="100%" stop-color="#389BDE"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="108" height="108" rx="24" fill="url(#fredBg)" stroke="rgba(197, 160, 89, 0.35)" stroke-width="2"/>
  <!-- Econometric Trend Curves & Bars -->
  <rect x="26" y="56" width="16" height="34" rx="4" fill="url(#fredBar1)"/>
  <rect x="52" y="40" width="16" height="50" rx="4" fill="url(#fredBar2)"/>
  <rect x="78" y="24" width="16" height="66" rx="4" fill="url(#fredBar3)"/>
  <!-- Connecting Spline / Time-Series Line -->
  <path d="M34 52 Q60 36 86 20" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <circle cx="34" cy="52" r="3.5" fill="#FFFFFF"/>
  <circle cx="60" cy="36" r="3.5" fill="#FFFFFF"/>
  <circle cx="86" cy="20" r="3.5" fill="#FFFFFF"/>
  <!-- FRED Acronym Typography -->
  <text x="60" y="103" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">FRED</text>
</svg>